<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trend Delivery</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div>
      <h1>🚚 Trend Delivery</h1>
      <p>إدارة التوصيل والطلبات والسائقين والشات</p>
    </div>
    <button id="logout" class="secondary" hidden>تسجيل خروج</button>
  </header>

  <main>
    <section id="loginCard" class="card">
      <h2>تسجيل الدخول</h2>
      <input id="name" placeholder="الاسم">
      <select id="role">
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="dispatcher">Dispatcher</option>
        <option value="employee" selected>Employee</option>
        <option value="driver">Driver</option>
      </select>
      <button id="login">دخول</button>
      <small>نسخة أولية للتجربة — يتم استبدال تسجيل الدخول بقاعدة بيانات Supabase عند ربطها.</small>
    </section>

    <section id="app" hidden>
      <div class="welcome card">
        <strong id="who"></strong>
        <span id="roleLabel"></span>
      </div>

      <div class="grid">
        <section class="card">
          <h2>📦 الطلبات</h2>
          <button onclick="loadOrders()">تحديث</button>
          <div id="orders"></div>
        </section>

        <section class="card">
          <h2>👥 المستخدمون</h2>
          <button onclick="loadUsers()">عرض المستخدمين</button>
          <div id="users"></div>
        </section>

        <section class="card">
          <h2>💬 الشات</h2>
          <div class="row">
            <input id="chatTo" placeholder="ID الموظف/السائق">
            <input id="chatText" placeholder="اكتب رسالة">
            <button onclick="sendMessage()">إرسال</button>
          </div>
          <button onclick="loadChat()">تحديث الشات</button>
          <div id="chat"></div>
        </section>

        <section class="card">
          <h2>📍 السائق</h2>
          <button onclick="sendLocation()">إرسال موقعي الحالي</button>
          <button onclick="loadLocations()">مواقع السائقين</button>
          <div id="locations"></div>
        </section>

        <section class="card">
          <h2>📲 موقع العميل عبر WhatsApp</h2>
          <input id="customerPhone" placeholder="رقم العميل بدون +">
          <button onclick="requestLocation()">إنشاء طلب الموقع</button>
          <a id="waLink" target="_blank" hidden>فتح WhatsApp</a>
        </section>
      </div>
    </section>
  </main>
<script src="/app.js"></script>
</body>
</html>

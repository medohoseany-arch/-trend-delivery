<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trend Delivery Service</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="center" style="display:grid;">

    <div class="card login-card">

      <img class="login-logo" src="/trend-logo.png" alt="Trend Delivery Service logo">
      <h1>Trend Delivery Service</h1>

      <p class="muted">تسجيل الدخول للنظام</p>

      <input
        id="username"
        type="text"
        placeholder="اسم المستخدم"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button id="loginBtn" type="button" onclick="login()">
        دخول
      </button>

      <div id="loginMsg" class="msg"></div>
    </div>

  </div>


  <!-- APP -->
  <div id="app" class="hidden" style="display:none!important;">

    <header>

      <div class="brand">
        Trend Delivery Service
      </div>

      <div class="header-actions">

        <button
          class="ghost"
          onclick="toggleLang()"
        >
          AR / EN
        </button>

        <button
          class="danger"
          onclick="logout()"
        >
          خروج
        </button>

      </div>

    </header>


    <div class="layout">

      <!-- SIDEBAR -->
      <aside id="sidebar">

        <button onclick="show('dashboard')">
          🏠 لوحة التحكم
        </button>

        <button onclick="show('order')">
          ➕ إدخال أوردر
        </button>

        <button onclick="show('search')">
          🔎 بحث
        </button>

        <button onclick="show('shipments')">
          📦 الشحنات
        </button>

        <button onclick="show('jobs')">
          🚚 مهام التوصيل
        </button>

        <button onclick="show('jobcode')">
          🔢 تحديث كود مهمة التوصيل
        </button>

        <button onclick="show('returns')">
          ↩️ المرتجعات للتاجر
        </button>

        <button onclick="show('merchants')">
          🏪 التجار
        </button>

        <button onclick="show('drivers')">
          🧑‍✈️ السائقون
        </button>

        <button onclick="show('areas')">
          📍 الإمارات والمناطق
        </button>

        <button onclick="show('accounting')">
          💰 الحسابات
        </button>

        <button onclick="show('expenses')">
          ⛽ مصروفات السائق
        </button>

        <button onclick="show('audit')">
          🧾 سجل العمليات
        </button>
        <button onclick="show('employees')">
          👥 الموظفون والصلاحيات
        </button>

        <button onclick="show('chat')">
          💬 شات الموظفين
        </button>


      </aside>


      <!-- CONTENT -->
      <main id="content"></main>

    </div>

  </div>


  <!-- CURRENT APP.JS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="/app.js?v=20261002-3"></script>

</body>

</html>

<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trend Delivery Service</title>
  <link rel="stylesheet" href="/styles.css?v=20261003-dashboard-actions">
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="center">

    <div class="card login-card">

      <img class="login-logo" src="/logo.jpeg" alt="Trend Express Delivery Service">
      <h1>Trend Delivery Service</h1>

      <p class="muted">تسجيل الدخول للنظام</p>

      <input
  id="username"
  type="text"
  placeholder="اسم المستخدم"
  autocomplete="username"
>

<input
  id="password"
  type="password"
  placeholder="كلمة المرور"
  autocomplete="current-password"
>

<button
  id="loginBtn"
  type="button"
  onclick="login()"
>
  دخول
</button>

<div id="loginMsg" class="msg"></div>
    </div>

  </div>


  <!-- APP -->
  <div id="app" class="hidden">

    <header>

      <div class="brand">
        <img class="brand-logo" src="/logo.jpeg" alt="Trend Express">
        <span>Trend Delivery Service</span>
        <span id="currentUser" class="current-user" aria-label="اسم المستخدم"></span>
      </div>

      <div class="header-actions">

        <button
          class="ghost"
          onclick="toggleLang()"
        >
          AR / EN
        </button>

        <button
          class="danger"
          onclick="logout()"
        >
          خروج
        </button>

      </div>

    </header>


    <div class="layout">

      <!-- TOP NAVIGATION -->
      <nav id="topNav" class="top-nav" aria-label="Main navigation"></nav>

      <!-- CONTENT -->
      <main id="content"></main>

    </div>

  </div>


  <!-- Excel reader -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <!-- CURRENT APP.JS -->
  <script src="/app.js?v=20261003-dashboard-actions"></script>

</body>

</html>
